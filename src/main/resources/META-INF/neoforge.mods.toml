modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/laggyboi20-jpg/ViveMonkeCraft-ClientNeoForge/issues"

[[mods]]
modId = "vivemonkecraft"
version = "${version}"
displayName = "ViveMonkeCraft"
authors = "Laggyboi"
logoFile = "assets/vivemonkecraft/icon.png"
description = '''
Gorilla Tag-style VR locomotion for Minecraft ${minecraft_version}. Requires Vivecraft 1.3.x (PCVR).
Grab surfaces with your hands and swing through the world.
'''

[[mixins]]
config = "vivemonkecraft.client.mixins.json"

[[dependencies.vivemonkecraft]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.vivemonkecraft]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "CLIENT"

# Vivecraft is NOT declared as a hard dependency on purpose: VivecraftBridge
# reaches it entirely by reflection and degrades to "no VR" when it is absent,
# exactly as on the Fabric branch.
[[dependencies.vivemonkecraft]]
modId = "cloth_config"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"
